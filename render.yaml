services:
  - type: web
    name: threatlens-backend
    runtime: docker
    dockerfilePath: Dockerfile.backend
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: HOST
        value: 0.0.0.0
      - key: GEOIP_USE_IPAPI
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SAFE_BROWSING_API_KEY
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PUBSUB_TOPIC
        sync: false
      - key: PUBSUB_PUSH_AUDIENCE
        sync: false
